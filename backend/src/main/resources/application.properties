spring.application.name=aluguel-carros

# ===== Servidor =====
server.port=${SERVER_PORT:8080}

# ===== Banco de dados: Supabase (PostgreSQL) =====
# Preencha as variaveis no arquivo .env (veja .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-chave-secreta-bem-longa-para-hs256}
# Tempo de expiracao do token em milissegundos (padrao: 24h)
app.jwt.expiration=86400000

# ===== CORS (front-end React/Vite) =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
